<div class="admin-container">
  <h2 class="page-title">
    <mat-icon>admin_panel_settings</mat-icon>
    Amministrazione Tartufi
  </h2>

  <div class="admin-grid">
    <mat-card class="list-card">
      <mat-card-header class="list-header">
        <mat-card-title>Elenco</mat-card-title>
        <div class="header-actions">
          <button mat-raised-button color="primary" type="button" (click)="openAddDialog()">
            <mat-icon>add</mat-icon>
            Nuovo
          </button>
        </div>
      </mat-card-header>
      <table mat-table [dataSource]="truffles()" class="mat-elevation-z1">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let t">{{ t.name }}</td>
        </ng-container>
        <ng-container matColumnDef="season">
          <th mat-header-cell *matHeaderCellDef>Stagione</th>
          <td mat-cell *matCellDef="let t">
            {{ t.seasonStartMonth || '-' }}/{{ t.seasonEndMonth || '-' }}
          </td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let t">
            <button mat-button color="primary" (click)="openEditDialog(t)"><mat-icon>edit</mat-icon> Modifica</button>
            <button mat-button color="warn" (click)="confirmDelete(t)"><mat-icon>delete</mat-icon> Elimina</button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card>

    <!-- right column removed per request -->
  </div>
</div>
