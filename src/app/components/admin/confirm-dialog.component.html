<h2 mat-dialog-title>{{ data.title || 'Conferma' }}</h2>
<div mat-dialog-content>
  <p>{{ data.message || 'Sei sicuro?' }}</p>
</div>
<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">{{ data.cancelText || 'Annulla' }}</button>
  <button mat-raised-button color="warn" (click)="confirm()">{{ data.confirmText || 'Conferma' }}</button>
</div>
